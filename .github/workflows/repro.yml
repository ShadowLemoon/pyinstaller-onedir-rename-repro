name: repro

on:
  push:
  workflow_dispatch:

# Isolate two variables that differed between the first two CI rounds, with
# PyInstaller fixed at 6.21.0 (where the repro script runs fine):
#   - the CPython build: python-build-standalone (uv) vs actions/setup-python toolcache
#   - the installer:      uv pip vs pip

jobs:
  uv-python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        installer: ["uv", "pip"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Create venv (uv-managed CPython 3.11.12)
        run: |
          uv python install 3.11.12
          uv venv --python 3.11.12 .venv

      - name: Install dependencies (${{ matrix.installer }})
        shell: pwsh
        run: |
          if ("${{ matrix.installer }}" -eq "uv") {
            uv pip install --python .venv/Scripts/python.exe "pyinstaller==6.21.0" "PySide6" "PySide6-Fluent-Widgets==1.11.2" "setuptools"
            uv pip list --python .venv/Scripts/python.exe
          } else {
            .venv/Scripts/python.exe -m ensurepip --upgrade
            .venv/Scripts/python.exe -m pip install "pyinstaller==6.21.0" "PySide6" "PySide6-Fluent-Widgets==1.11.2" "setuptools"
            .venv/Scripts/python.exe -m pip list
          }
          .venv/Scripts/python.exe -V

      - name: Build onedir bundle
        run: .venv/Scripts/python.exe -m PyInstaller --onedir --noconfirm --clean --contents-directory .runtime toy.py

      - name: Run app and probe renames
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\toy\toy.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $PWD "dist\toy") -PassThru `
                -RedirectStandardOutput app_out.txt -RedirectStandardError app_err.txt
          Start-Sleep -Seconds 10
          Write-Host "app alive: $(-not $p.HasExited)"
          if ($p.HasExited) {
            Write-Host "::error::app exited before probe; rename result is INVALID"
            Get-Content app_out.txt, app_err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
            exit 1
          }
          .venv/Scripts/python.exe probe.py
          Get-Content probe_result.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvpy-${{ matrix.installer }}
          path: |
            probe_result.txt
            app_out.txt
            app_err.txt
          if-no-files-found: warn

  toolcache-python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        installer: ["uv", "pip"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install dependencies (${{ matrix.installer }})
        shell: pwsh
        run: |
          $py = python -c "import sys; print(sys.executable)"
          Write-Host "interpreter: $py"
          if ("${{ matrix.installer }}" -eq "uv") {
            python -m pip install --upgrade uv
            uv pip install --python "$py" "pyinstaller==6.21.0" "PySide6" "PySide6-Fluent-Widgets==1.11.2" "setuptools"
            uv pip list --python "$py"
          } else {
            python -m pip install --upgrade pip
            python -m pip install "pyinstaller==6.21.0" "PySide6" "PySide6-Fluent-Widgets==1.11.2" "setuptools"
            python -m pip list
          }
          python -V

      - name: Build onedir bundle
        run: python -m PyInstaller --onedir --noconfirm --clean --contents-directory .runtime toy.py

      - name: Run app and probe renames
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\toy\toy.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $PWD "dist\toy") -PassThru `
                -RedirectStandardOutput app_out.txt -RedirectStandardError app_err.txt
          Start-Sleep -Seconds 10
          Write-Host "app alive: $(-not $p.HasExited)"
          if ($p.HasExited) {
            Write-Host "::error::app exited before probe; rename result is INVALID"
            Get-Content app_out.txt, app_err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
            exit 1
          }
          python probe.py
          Get-Content probe_result.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolcache-${{ matrix.installer }}
          path: |
            probe_result.txt
            app_out.txt
            app_err.txt
          if-no-files-found: warn
