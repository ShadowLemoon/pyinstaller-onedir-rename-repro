name: repro

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pyinstaller: ["6.7.0", "6.21.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          python -V
          ver

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==${{ matrix.pyinstaller }}"
          pip install "PySide6" "PySide6-Fluent-Widgets==1.11.2"
          pip list

      - name: Build onedir bundle
        run: |
          pyinstaller --onedir --noconfirm --clean --contents-directory .runtime toy.py

      - name: Run app and probe renames
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\toy\toy.exe"
          Write-Host "starting $exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $PWD "dist\toy") -PassThru
          Start-Sleep -Seconds 10
          Write-Host "app alive: $(-not $p.HasExited)"
          python probe.py
          Get-Content probe_result.txt

      - name: Upload bundle info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result-${{ matrix.pyinstaller }}
          path: probe_result.txt
          if-no-files-found: warn
