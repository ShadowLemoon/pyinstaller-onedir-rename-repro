name: repro

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pyinstaller: "6.7.0"
            python: "3.11.12"
          - pyinstaller: "6.16.0"
            python: "3.11.12"
          - pyinstaller: "6.21.0"
            python: "3.11.12"
          - pyinstaller: "6.21.0"
            python: "3.11.9"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Create venv with Python ${{ matrix.python }}
        run: |
          uv python install ${{ matrix.python }}
          uv venv --python ${{ matrix.python }} .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv/Scripts/python.exe "pyinstaller==${{ matrix.pyinstaller }}"
          uv pip install --python .venv/Scripts/python.exe "PySide6" "PySide6-Fluent-Widgets==1.11.2" "setuptools"
          .venv/Scripts/python.exe -V

      - name: Build onedir bundle
        run: |
          .venv/Scripts/python.exe -m PyInstaller --onedir --noconfirm --clean --contents-directory .runtime toy.py

      - name: Run app and probe renames
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\toy\toy.exe"
          Write-Host "starting $exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $PWD "dist\toy") -PassThru
          Start-Sleep -Seconds 10
          Write-Host "app alive: $(-not $p.HasExited)"
          .venv/Scripts/python.exe probe.py
          Get-Content probe_result.txt

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.pyinstaller }}-py${{ matrix.python }}
          path: probe_result.txt
          if-no-files-found: warn
